<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvil - Library</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="overflow: hidden;">

    <!-- Fullscreen Dynamic Background -->
    <div class="bp-background">
        <!-- Bioshock Background -->
        <img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-48.png" alt="BG" style="filter: blur(8px) brightness(0.6);">
        <div class="bp-vignette"></div>
    </div>

    <!-- UI Overlay Layer -->
    <div class="bp-ui-layer">
        
        <!-- Top Bar (Xbox Style) -->
        <header class="top-bar">
            <div class="profile-info">
                <img src="https://via.placeholder.com/44" alt="Avatar" class="avatar">
                <div class="user-details">
                    <span class="username">Juxtopposed</span>
                    <span class="wallet"><span class="coin">⬡</span> 5,000 DAG</span>
                </div>
            </div>
            
            <nav class="main-nav">
                <a href="index.html">Store</a>
                <a href="Library_play_view.html" class="active">Library</a>
                <a href="Community.html">Community</a>
                <a href="#">Settings</a>
            </nav>

            <div class="system-status">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                <span>3:22 PM</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-stage">
            
            <!-- Horizontal Game Row (Console Navigation) -->
            <!-- We add custom scrollbars and JS to make it M&K friendly -->
            <div class="game-row-container" id="horizontal-scroll" style="overflow-x: auto; padding-bottom: 24px;">
                <style>
                    /* M&K Friendly Visible Scrollbar */
                    .game-row-container::-webkit-scrollbar { height: 8px; }
                    .game-row-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; margin: 0 80px; }
                    .game-row-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
                    .game-row-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
                </style>
                <div class="game-row" style="padding-left: 80px; padding-right: 80px;">
                    
                    <!-- Bioshock (Active) -->
                    <div class="game-card active">
                        <img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-48.png" alt="Bioshock">
                        <div class="card-border"></div>
                    </div>
                    
                    <div class="game-card"><img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-88@2x.png" alt="Game"></div>
                    <div class="game-card"><img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-89@2x.png" alt="Game"></div>
                    <div class="game-card"><img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-49-1@2x.png" alt="Game"></div>
                    <div class="game-card"><img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-49-2@2x.png" alt="Game"></div>
                    <div class="game-card"><img src="https://cdn.animaapp.com/projects/673b7776a04756fa27c1ca2c/releases/673b7a74a04756fa27c1ca39/img/image-102@2x.png" alt="Game"></div>

                </div>
            </div>

            <!-- Game Info Details (Appears below active card) -->
            <div class="active-game-info">
                <h1 class="game-title">Bioshock Remastered</h1>
                <div class="game-stats-grid">
                    <div class="stat action-stat" style="margin-left: 0; margin-right: 24px;">
                        <button class="btn-purchase" style="padding: 16px 48px; font-size: 18px;">PLAY</button>
                    </div>
                    <div class="stat">
                        <span class="label">Time played</span>
                        <span class="value">92 hours</span>
                    </div>
                    <div class="stat">
                        <span class="label">Last Played</span>
                        <span class="value">21 Aug 2022</span>
                    </div>
                    <div class="stat achievement-hunt">
                        <span class="label">Achievements</span>
                        <span class="value" style="gap: 8px;">
                            <span style="color:#4caf50; font-size:18px;">🏆</span> 
                            20/65
                        </span>
                    </div>
                    <div class="stat">
                        <span class="label">Cloud Status</span>
                        <span class="value" style="color: #4caf50;">Up to date</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Floating Overlay Panels (Activity & Friends) -->
        <aside class="floating-panel friends-panel" style="top: 140px; height: auto;">
            <div class="panel-header">
                <span>Recent Activity</span>
            </div>
            <div class="panel-content" style="gap: 12px;">
                <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                        <span style="font-size: 12px; font-weight: 700; color: var(--accent-orange);">Small Update</span>
                        <span style="font-size: 11px; color: var(--text-muted);">Oct 13</span>
                    </div>
                    <p style="font-size: 12px; line-height: 1.4; color: #fff;">It’s just a small but noteworthy update~</p>
                </div>
                <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                        <span style="font-size: 12px; font-weight: 700; color: var(--accent-orange);">Big Update</span>
                        <span style="font-size: 11px; color: var(--text-muted);">Oct 12</span>
                    </div>
                    <p style="font-size: 12px; line-height: 1.4; color: #fff;">Wow here’s a BIG update!</p>
                </div>
            </div>
        </aside>

        <!-- Bottom Dock -->
        <footer class="bottom-dock">
            <div class="dock-container">
                <button class="dock-btn" title="Store Page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
                <button class="dock-btn active" title="Achievements"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg></button>
                <button class="dock-btn" title="Community"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></button>
                <button class="dock-btn" title="Discussions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></button>
                <button class="dock-btn" title="Support"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></button>
            </div>
        </footer>

    </div>

    <!-- Mouse Wheel to Horizontal Scroll JS -->
    <script>
        const scrollContainer = document.getElementById('horizontal-scroll');
        scrollContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });
    </script>
</body>
</html>
